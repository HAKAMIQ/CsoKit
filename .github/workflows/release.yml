name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: windows-2025

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"

      - name: .NET info
        run: dotnet --info

      - name: Native toolchain info
        run: |
          cmake --version

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -property installationPath
          }
          else {
            Write-Host "vswhere.exe was not found. Build-Native.ps1 will use fallback discovery."
          }

      - name: Resolve release version
        run: |
          if ("${{ github.ref_type }}" -ne "tag") {
            throw "Official releases must run from a pushed signed tag. Manual dispatch is disabled."
          }

          $tagName = "${{ github.ref_name }}"
          if ($tagName -notmatch "^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$") {
            throw "Release tag must be a semantic version starting with v. Actual tag: $tagName"
          }

          $version = $tagName.Substring(1)
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Release version is empty."
          }

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=$tagName" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Release version: $version"
          Write-Host "Release tag:     $tagName"

      - name: Extract release notes
        run: .\scripts\Get-ReleaseNotes.ps1 -Version $env:RELEASE_VERSION -OutputPath "$env:RUNNER_TEMP\release-notes.md"

      - name: Publish release package
        run: .\scripts\Publish-Release.ps1 -Version $env:RELEASE_VERSION -Runtime win-x64

      - name: Verify release package
        run: .\scripts\Verify-Release.ps1 -Version $env:RELEASE_VERSION -Runtime win-x64

      - name: Attest release ZIP
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/release/csokit-${{ env.RELEASE_VERSION }}-win-x64.zip

      - name: Attest SHA256 manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/publish/win-x64/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: csokit-${{ env.RELEASE_VERSION }}-win-x64
          path: |
            artifacts/release/*.zip
            artifacts/publish/win-x64/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zipPath = "artifacts\release\csokit-$env:RELEASE_VERSION-win-x64.zip"
          $shaPath = "artifacts\publish\win-x64\SHA256SUMS.txt"

          if (-not (Test-Path $zipPath)) {
            throw "Release ZIP was not found: $zipPath"
          }

          if (-not (Test-Path $shaPath)) {
            throw "SHA256 manifest was not found: $shaPath"
          }

          $notesPath = "$env:RUNNER_TEMP\release-notes.md"
          $zipName = Split-Path -Leaf $zipPath
          $zipHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashSection = @(
            "",
            "## SHA-256",
            "",
            '```',
            "$zipHash  $zipName",
            '```',
            "",
            "Verify the build provenance with ``gh attestation verify $zipName --repo $env:GITHUB_REPOSITORY``."
          ) -join "`n"
          Add-Content -LiteralPath $notesPath -Value $hashSection -Encoding utf8

          $releaseArgs = @(
            "release",
            "create",
            $env:RELEASE_TAG,
            $zipPath,
            $shaPath,
            "--title",
            "CsoKit $env:RELEASE_VERSION",
            "--notes-file",
            "$env:RUNNER_TEMP\release-notes.md"
          )

          gh @releaseArgs
